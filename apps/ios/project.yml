name: Mantel
options:
  bundleIdPrefix: com.mattelhart
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug
  groupSortPosition: top
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: false
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
    CODE_SIGN_STYLE: Automatic
    # Pick your Personal Team in Xcode after opening the project.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
targets:
  Mantel:
    type: application
    platform: iOS
    sources:
      - path: Mantel
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattelhart.mantel
        PRODUCT_NAME: Mantel
        INFOPLIST_FILE: Mantel/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    info:
      path: Mantel/Info.plist
    scheme:
      testTargets:
        - MantelTests
  MantelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MantelTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattelhart.mantel.tests
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mantel.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mantel"
        BUNDLE_LOADER: "$(TEST_HOST)"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - target: Mantel
