<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f3f4f6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <title>Family Calendar</title>
    <script>
      // Paint the remembered theme before React mounts, so a light theme does not flash
      // the wrong ground on every reload. Nothing remembered means Airy, the default
      // for a new install. Keep the key and ids in step with src/theme.ts.
      try {
        var themes = { midnight: '#0f172a', daylight: '#f6f1e7', hearth: '#1c1613', airy: '#f3f4f6' }
        var t = localStorage.getItem('mantel.theme')
        if (!themes[t]) t = 'airy'
        document.documentElement.dataset.theme = t
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', themes[t])
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
