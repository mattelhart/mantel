name: Windows desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build the installer
        working-directory: apps/desktop
        run: cargo tauri build --bundles nsis

      - name: Collect the installer and the portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS did not produce an installer" }
          Copy-Item $setup.FullName "dist/mantel-calendar-setup.exe"
          Copy-Item "apps/desktop/src-tauri/target/release/mantel-calendar.exe" "dist/mantel-calendar.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: mantel-calendar-windows
          path: dist/
          if-no-files-found: error
