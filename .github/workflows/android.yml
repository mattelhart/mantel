name: Android apps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android-tv/**"
      - ".github/workflows/android.yml"
      - "VERSION"
  push:
    branches: [main]
    paths:
      - "apps/android-tv/**"
      - ".github/workflows/android.yml"
      - "VERSION"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count. A shallow clone would number the
          # APK too low, and Android would refuse to install it over the last one.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test and build the debug APKs
        working-directory: apps/android-tv
        run: ./gradlew assembleDebug test --no-daemon

      - name: Collect the APKs
        run: |
          mkdir -p dist
          cp apps/android-tv/app/build/outputs/apk/debug/app-debug.apk dist/mantel-tv-debug.apk
          cp apps/android-tv/phone/build/outputs/apk/debug/phone-debug.apk dist/mantel-phone-debug.apk
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs dist/mantel-tv-debug.apk
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs dist/mantel-phone-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mantel-android-debug
          path: |
            dist/mantel-tv-debug.apk
            dist/mantel-phone-debug.apk
          if-no-files-found: error
